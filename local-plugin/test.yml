name: render the examples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          curl.exe -sSfL --retry 4 --retry-delay 5 -o $zip 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg download failed ($LASTEXITCODE)" }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $dir
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg unzip failed ($LASTEXITCODE)" }
          $exe = Get-ChildItem -Path $dir -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw 'ffmpeg.exe not found in the archive' }
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName

      - name: Requirements
        shell: bash
        run: |
          python -m pip install Pillow numpy
          cd skills/invokard-studio-local/animation && npm ci --no-fund --no-audit

      - name: Doctor
        shell: bash
        run: |
          python skills/invokard-studio-local/scripts/media.py doctor
          node skills/invokard-studio-local/animation/cli.mjs doctor

      - name: Render both examples and verify them
        shell: bash
        run: |
          python examples/first-reel/reel.py --fast
          python examples/animated-reel/reel.py --fast
          python skills/invokard-studio-local/scripts/media.py verify examples/first-reel/work/out/reel_9x16.mp4
          python skills/invokard-studio-local/scripts/media.py verify examples/animated-reel/work/out/reel.mp4
